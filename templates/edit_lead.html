{% extends "base.html" %}
{% block content %}
<form method="post" action="/leads/new">
    <label>
        <input name="name" value = "{{lead.name}}">
    </label>
    <label>
        <input name="company" value = "{{lead.company}}">
    </label>
    <label>
        <input name="web_site_url" value = "{{lead.web_site_url}}">
    </label>
    <label>
        <input name="sector" value = "{{lead.sector}}">
    </label>
    <label>
        <textarea name="notes">{{ lead.notes }}</textarea>
    </label>
    <button type="submit">Submit lead</button>
</form>
{% endblock%}
